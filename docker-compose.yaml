# docker-compose.yml

services:
  # ---------------------------------------------------
  # Kafka in KRaft mode (no ZooKeeper)
  # ---------------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.8.3  # <-- FIX 1: Corrected version
    container_name: kafka
    ports:
      - "9092:9092"  # External port
    environment:
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_LISTENERS: INTERNAL://:9090,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9090,EXTERNAL://127.0.0.1:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: "zKraftCluster12345"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka-data:/var/lib/kafka/data
    restart: unless-stopped

  # ---------------------------------------------------
  # PostgreSQL for persistent user data
  # ---------------------------------------------------
  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_USER: admin     # <-- WARNING: This has changed
      POSTGRES_PASSWORD: admin # <-- WARNING: This has changed
      POSTGRES_DB: goalie      # <-- WARNING: This has changed
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped

  # ---------------------------------------------------
  # pgAdmin for DB GUI
  # ---------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    depends_on:
      - postgres
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@local.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin # <-- FIX 2: Added persistence
    restart: unless-stopped

  # ---------------------------------------------------
  # Kafka UI for topic visualization
  # ---------------------------------------------------
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      - kafka
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9090 # <-- Correctly points to INTERNAL
      KAFKA_CLUSTERS_0_ZOOKEEPER: ""
    restart: unless-stopped
  
  # # ---------------------------------------------------
  # # Redis for future session management
  # # ---------------------------------------------------
  # redis:
  #   image: redis:7-alpine
  #   container_name: redis
  #   ports:
  #     - "6379:6379"
  #   volumes:
  #     - redis-data:/data # <-- FIX 3: Added persistence
  #   restart: unless-stopped

# Define the persistent volumes
volumes:
  kafka-data:
  pg-data:
  pgadmin-data: # <-- Added
  # redis-data:   # <-- Added