<!DOCTYPE html>
<html>
<head>
    <title>Live Snippets</title>
    <style>
        :root {
            --bg-primary: #1a1a1b;
            --bg-secondary: #272729;
            --bg-tertiary: #343536;
            --text-primary: #d7dadc;
            --text-secondary: #818384;
            --border-color: #5a5a5c;
            --accent-color: #4f9bf5;
            --live-color: #ff4500;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            width: 380px;
            margin: 0;
            padding: 16px;
            background-color: var(--bg-primary);
            color: var(--text-primary);
        }
        
        /* --- Login View --- */
        #login-view { display: none; }
        .form-container { display: flex; flex-direction: column; gap: 12px; }
        .form-container h3 { text-align: center; margin-top: 0; color: var(--text-primary); }
        .form-container input { padding: 10px; border-radius: 4px; border: 1px solid var(--border-color); background-color: var(--bg-secondary); color: var(--text-primary); }
        .form-container button { padding: 10px; border: none; border-radius: 4px; background-color: var(--accent-color); color: white; font-weight: bold; cursor: pointer; }
        .form-toggle { color: var(--accent-color); cursor: pointer; font-size: 0.9em; text-align: center; margin-top: 8px; }
        .auth-error { color: var(--live-color); font-size: 0.9em; text-align: center; display: none; }

        /* --- Main App View --- */
        #main-app-view { display: none; }
        .header { display: flex; justify-content: space-between; align-items: center; }
        #logout-btn { background: none; border: none; color: var(--text-secondary); cursor: pointer; font-size: 0.8em; }
        #logout-btn:hover { color: var(--accent-color); }
        
        .tab-nav { display: flex; border-bottom: 1px solid var(--border-color); margin-bottom: 12px; }
        .tab-btn { flex: 1; padding: 10px; background: none; border: none; color: var(--text-secondary); font-weight: bold; cursor: pointer; border-bottom: 2px solid transparent; }
        .tab-btn.active { color: var(--text-primary); border-bottom-color: var(--accent-color); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        /* Sub-tabs */
        .sub-tab-nav { display: flex; gap: 8px; margin-bottom: 10px; }
        .sub-tab-btn { background: var(--bg-tertiary); color: var(--text-secondary); border: 1px solid var(--border-color); border-radius: 12px; padding: 4px 10px; font-size: 0.8em; cursor: pointer; }
        .sub-tab-btn.active { background: var(--accent-color); color: white; border-color: var(--accent-color); }
        
        /* Match List */
        .match-list { max-height: 300px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
        .match-card { background-color: var(--bg-secondary); border-radius: 6px; border: 1px solid var(--border-color); padding: 12px; cursor: pointer; }
        .match-card:hover { border-color: var(--accent-color); }
        .match-teams { display: flex; align-items: center; justify-content: space-between; font-weight: bold; }
        .team { display: flex; align-items: center; gap: 8px; }
        .team img { width: 24px; height: 24px; }
        .match-score { font-size: 1.2em; }
        .live-dot { color: var(--live-color); font-weight: bold; }
        .match-info { font-size: 0.8em; color: var(--text-secondary); margin-top: 8px; }
        .list-placeholder { color: var(--text-secondary); text-align: center; padding: 20px; }
        
        /* Search Tab */
        #search-input { width: calc(100% - 20px); padding: 10px; border-radius: 4px; border: 1px solid var(--border-color); background-color: var(--bg-secondary); color: var(--text-primary); margin-bottom: 10px; }
        .team-list-item { display: flex; justify-content: space-between; align-items: center; padding: 8px; border-bottom: 1px solid var(--bg-tertiary); }
        .follow-btn { background: var(--accent-color); color: white; border: none; border-radius: 4px; padding: 5px 10px; cursor: pointer; font-size: 0.9em; }
        .follow-btn:disabled { background: var(--bg-tertiary); color: var(--text-secondary); }

        /* Live Feed */
        #live-feed-view { display: none; }
        .feed-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 8px; }
        .feed-header h4 { margin: 0; }
        #back-to-matches { background: none; border: 1px solid var(--border-color); color: var(--text-primary); border-radius: 4px; padding: 4px 8px; cursor: pointer; }
        #feed-list { list-style: none; padding: 0; margin-top: 10px; max-height: 250px; overflow-y: auto; }
        li.feed-item { padding: 8px 10px; border-bottom: 1px solid var(--bg-tertiary); }
        li.event { background: #4a4a01; font-weight: bold; }
        li.snippet { font-style: italic; }
        
    </style>
</head>
<body>
    
    <div id="login-view">
        <div id="register-form" class="form-container" style="display: none;">
            <h3>Create Account</h3>
            <input type="email" id="register-email" placeholder="Email">
            <input type="password" id="register-password" placeholder="Password">
            <button id="register-btn">Register</button>
            <div id="auth-error-register" class="auth-error">Error text</div>
            <div class="form-toggle" id="show-login">Already have an account? Login</div>
        </div>
        <div id="login-form" class="form-container">
            <h3>Login</h3>
            <input type="email" id="login-email" placeholder="Email">
            <input type="password" id="login-password" placeholder="Password">
            <button id="login-btn">Login</button>
            <div id="auth-error-login" class="auth-error">Error text</div>
            <div class="form-toggle" id="show-register">Don't have an account? Register</div>
        </div>
    </div>

    <div id="main-app-view">
        <div class="header">
            <h4>Live Snippets</h4>
            <button id="logout-btn">Log Out &rarr;</button> </div>
        
        <nav class="tab-nav">
            <button class="tab-btn active" data-tab="all-matches">All Matches</button>
            <button class="tab-btn" data-tab="favorites">Favorites</button>
            <button class="tab-btn" data-tab="search">Search</button>
        </nav>

        <div id="tab-all-matches" class="tab-content active">
            <div class="sub-tab-nav">
                <button class="sub-tab-btn active" data-filter="live">Live</button>
                <button class="sub-tab-btn" data-filter="upcoming">Upcoming</button>
                <button class="sub-tab-btn" data-filter="finished">Finished</button>
            </div>
            <div class="match-list" id="all-matches-list">
                <div class="list-placeholder">Loading...</div>
            </div>
        </div>

        <div id="tab-favorites" class="tab-content">
             <div class="sub-tab-nav">
                <button class="sub-tab-btn active" data-filter="live">Live</button>
                <button class="sub-tab-btn" data-filter="upcoming">Upcoming</button>
                <button class="sub-tab-btn" data-filter="finished">Finished</button>
            </div>
            <div class="match-list" id="fav-matches-list">
                <div class="list-placeholder">Loading...</div>
            </div>
        </div>

        <div id="tab-search" class="tab-content">
            <input type="search" id="search-input" placeholder="Search for a team...">
            <div class="match-list" id="team-search-list">
                 <div class="list-placeholder">Start typing to find teams.</div>
            </div>
        </div>
    </div>
    
    <div id="live-feed-view">
        <div class="feed-header">
            <h4 id="feed-header-title">Match Feed</h4>
            <button id="back-to-matches">&larr; Back</button>
        </div>
        <ul id="feed-list">
            </ul>
    </div>

    <script src="socket.io.min.js"></script>
    <script src="popup.js"></script>
</body>
</html>
