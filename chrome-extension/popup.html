<!DOCTYPE html>
<html>
<head>
    <title>Live Snippets</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; width: 350px; padding: 10px; }
        h3 { margin-top: 0; }
        ul { list-style: none; padding: 0; margin: 0; max-height: 250px; overflow-y: auto; border: 1px solid #ddd; border-radius: 4px; }
        li { padding: 8px 10px; border-bottom: 1px solid #eee; }
        li:last-child { border-bottom: none; }
        li.event { background: #fffbe6; font-weight: bold; color: #725c00; }
        li.snippet { font-style: italic; color: #333; }
        .controls { margin-bottom: 10px; display: flex; gap: 8px; }
        .controls select { flex-grow: 1; padding: 5px; }
        .controls button { padding: 5px 10px; }
        #status { font-size: 0.8em; color: #777; padding-top: 5px; }
    </style>
</head>
<body>
    <div class="controls">
        <select id="match-select">
            <option value="">-- Select a Match --</option>
            </select>
        <button id="join-btn">Follow</button>
    </div>
    <div id="status">Connecting...</div>
    <ul id="feed-list">
        <li>Select a match to follow.</li>
    </ul>

    <script src="socket.io.min.js"></script>
    <script src="popup.js"></script>
</body>
</html>
