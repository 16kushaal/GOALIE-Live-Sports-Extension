<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Goalie Simple UI</title>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <style> /* ... styles ... */ </style>
</head>
<body>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const socket = io("http://localhost:5000");
            const dropdown = document.getElementById("matchDropdown");
            const snippetsDiv = document.getElementById("snippets");
            let currentMatchId = null;

            socket.on("connect", () => {
                console.log("Connected to WebSocket server!");
                snippetsDiv.innerHTML = '<p>Connected. Select a match.</p>';
            });

            // *** NEW DEBUG LISTENER ***
            // Log *any* event received from the server
            socket.onAny((eventName, ...args) => {
                console.log(`DEBUG: Received event '${eventName}' with data:`, args);
            });
            // ***************************

            socket.on("disconnect", () => {
                console.log("Disconnected from WebSocket server!");
                snippetsDiv.innerHTML = '<p style="color:red;">Disconnected. Trying to reconnect...</p>';
            });

            dropdown.onchange = () => {
                const newMatchId = dropdown.value;
                if (currentMatchId && currentMatchId !== newMatchId) {
                    console.log(`Unwatching: ${currentMatchId}`);
                    socket.emit("unwatch_match", { match_id: currentMatchId });
                }
                if (newMatchId) {
                    console.log(`Watching: ${newMatchId}`);
                    socket.emit("watch_match", { match_id: newMatchId });
                    snippetsDiv.innerHTML = `<p>Waiting for snippets for ${newMatchId}...</p>`;
                } else {
                     snippetsDiv.innerHTML = `<p>Select a match to see live snippets...</p>`;
                }
                currentMatchId = newMatchId; 
            };

            // Listen for 'new_snippet' events
            socket.on("new_snippet", (data) => {
                 // Add a log *before* the check
                console.log("DEBUG: 'new_snippet' handler received data:", data); 
                if (data.match_id === currentMatchId) {
                    console.log("New Snippet (Match OK):", data); // Modify original log slightly
                    const p = document.createElement("p");
                    p.innerHTML = `<strong>[${new Date(data.timestamp * 1000).toLocaleTimeString()}]</strong> ${data.snippet}`;
                    if (snippetsDiv.firstChild && snippetsDiv.firstChild.innerText.startsWith("Waiting for snippets")) {
                        snippetsDiv.innerHTML = '';
                    }
                    snippetsDiv.prepend(p); 
                } else {
                    // Add a log if the match ID doesn't match
                    console.log(`DEBUG: Snippet ignored. Current match is ${currentMatchId}, snippet is for ${data.match_id}`);
                }
            });
        });
    </script>
</body>
</html>
